server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: automation-sut
  messages:
    fallback-to-system-locale: false
  profiles:
    active: local
  datasource:
    url: jdbc:h2:mem:automation_sut;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    secret: local-demo-secret-key-for-jwt-signing-please-change

sut:
  metadata:
    display-name: QA Task Manager SUT
    version: "@project.version@"
    release-name: Localized QA baseline
    lifecycle-stage: QA_READY
    description: Stable QA baseline with localized GUI support
    default-locale: en

springdoc:
  swagger-ui:
    path: /swagger-ui.html
