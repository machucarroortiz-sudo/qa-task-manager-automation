<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|#{profile.title} - #{app.fullName}|">Profile - QA Task Manager SUT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/js/ui.js}"></script>
</head>
<body class="dashboard-body" th:attr="data-i18n-no-results=#{empty.results},data-i18n-empty-tasks=#{empty.tasks},data-i18n-empty-issues=#{empty.issues},data-i18n-delete-item=#{modal.delete.item},data-i18n-content-translate=#{contentTranslation.toggle},data-i18n-content-original=#{contentTranslation.showOriginal}">
<div class="dashboard-shell is-sidebar-collapsed profile-shell">
    <aside th:replace="~{fragments/navigation :: dashboardSidebar('profile', 'profile.title')}"></aside>
    <div class="dashboard-main-shell">
        <header class="dashboard-topbar">
            <button type="button" class="dashboard-menu-button" data-testid="dashboard-sidebar-toggle" th:attr="aria-label=#{common.toggleSidebar}" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></button>
            <strong th:text="#{profile.title}">Profile</strong>
            <div th:replace="~{fragments/navigation :: topbarActions}"></div>
        </header>
        <main class="dashboard-page profile-page">
            <section class="app-page-heading">
                <h1 data-testid="profile-title" th:text="#{profile.title}">Profile</h1>
                <p th:text="#{profile.subtitle}">View your account information and role details.</p>
            </section>
            <section class="profile-card" data-testid="profile-details">
                <div class="profile-row">
                    <span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
                    <strong th:text="#{common.userId}">User ID</strong>
                    <span th:text="${user.id}" data-testid="profile-user-id"></span>
                </div>
                <div class="profile-row">
                    <span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="m4 7 8 6 8-6"></path></svg></span>
                    <strong th:text="#{common.email}">Email</strong>
                    <span th:text="${user.email}" data-testid="profile-email"></span>
                </div>
                <div class="profile-row">
                    <span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path></svg></span>
                    <strong th:text="#{common.role}">Role</strong>
                    <span class="role-badge" th:text="${user.role}" data-testid="profile-role"></span>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
