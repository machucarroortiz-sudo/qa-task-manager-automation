<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile - QA Task Manager SUT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/js/ui.js}"></script>
</head>
<body class="dashboard-body">
<div class="dashboard-shell is-sidebar-collapsed profile-shell">
    <aside class="dashboard-sidebar" data-testid="dashboard-navigation">
        <a th:href="@{/dashboard}" class="dashboard-brand" data-testid="nav-dashboard-brand-link">
            <span class="dashboard-brand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"></path><path d="M9 12l2 2 4-5"></path><path d="M9 7h6"></path></svg></span>
            <span><strong>QA Task Manager</strong><small>SUT</small></span>
        </a>
        <nav class="dashboard-side-nav" aria-label="Profile navigation">
            <a th:href="@{/dashboard}" data-testid="nav-dashboard-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4z"></path><path d="M13 4h7v7h-7z"></path><path d="M4 13h7v7H4z"></path><path d="M13 13h7v7h-7z"></path></svg>Dashboard</a>
            <a th:href="@{/tasks}" data-testid="nav-tasks-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12"></path><path d="M8 12h12"></path><path d="M8 18h12"></path><path d="M4 6h.01"></path><path d="M4 12h.01"></path><path d="M4 18h.01"></path></svg>Tasks</a>
            <a th:href="@{/issues}" data-testid="nav-issues-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 4.2 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0Z"></path></svg>Issues</a>
            <a th:href="@{/admin}" data-testid="nav-admin-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Users/Admin</a>
            <a th:if="${isAdmin}" th:href="@{/settings}" data-testid="nav-settings-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 0 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 0 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 0 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1a2 2 0 0 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z"></path></svg>Settings</a>
        </nav>
        <div class="dashboard-sidebar-spacer" aria-hidden="true"></div>
    </aside>
    <div class="dashboard-main-shell">
        <header class="dashboard-topbar">
            <button type="button" class="dashboard-menu-button" data-testid="dashboard-sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></button>
            <strong>Profile</strong>
            <div class="dashboard-topbar-actions">
                <div class="dashboard-search"><input type="search" placeholder="Search..." data-testid="global-search-input" aria-label="Global search"><svg viewBox="0 0 24 24" role="img" aria-label="Search icon"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg></div>
                <div class="notification-panel"><button type="button" class="notification-bell" data-testid="notification-bell" aria-expanded="false" aria-controls="notification-dropdown"><svg viewBox="0 0 24 24" role="img" aria-label="Notifications"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg><span class="notification-badge" data-testid="unread-notification-badge" th:text="${unreadNotificationCount}" th:hidden="${unreadNotificationCount == 0}"></span></button>
                    <section id="notification-dropdown" class="notification-dropdown" data-testid="notification-dropdown" hidden><div class="notification-dropdown-header"><strong>Notifications</strong><span th:text="${unreadNotificationCount + ' unread'}"></span></div><p class="notification-empty" th:if="${#lists.isEmpty(notifications)}">No unread notifications.</p><article class="notification-item" data-testid="notification-item" th:each="notification : ${notifications}"><div><span class="notification-type" th:text="${notification.type()}"></span><p th:text="${notification.message()}"></p><small th:text="${notification.createdAt()}"></small></div><form th:action="@{/dashboard/notifications/{id}/read(id=${notification.id()})}" method="post"><button type="submit" class="notification-read-button" data-testid="mark-notification-read-button">Read</button></form></article></section>
                </div>
                <a th:href="@{/profile}" class="dashboard-topbar-user" data-testid="nav-profile-link"><span class="dashboard-avatar" th:text="${#strings.substring(currentUser.email, 0, 1).toUpperCase()}"></span><span><strong th:text="${currentUser.email}"></strong><small th:text="${currentUser.role}"></small></span></a>
                <form th:action="@{/logout}" method="post" data-testid="nav-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="dashboard-topbar-logout" data-testid="nav-logout-button" aria-label="Log out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg></button></form>
            </div>
        </header>
        <main class="dashboard-page profile-page">
            <section class="app-page-heading">
                <h1 data-testid="profile-title">Profile</h1>
                <p>View your account information and role details.</p>
            </section>
            <section class="profile-card" data-testid="profile-details">
                <div class="profile-row">
                    <span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
                    <strong>User ID</strong>
                    <span th:text="${user.id}" data-testid="profile-user-id"></span>
                </div>
                <div class="profile-row">
                    <span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="m4 7 8 6 8-6"></path></svg></span>
                    <strong>Email</strong>
                    <span th:text="${user.email}" data-testid="profile-email"></span>
                </div>
                <div class="profile-row">
                    <span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path></svg></span>
                    <strong>Role</strong>
                    <span class="role-badge" th:text="${user.role}" data-testid="profile-role"></span>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
