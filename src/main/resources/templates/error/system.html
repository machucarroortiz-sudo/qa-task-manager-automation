<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${status} + ' - ' + #{app.fullName}">Error - QA Task Manager SUT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-body">
<main class="error-page" data-testid="error-page">
    <section class="error-card">
        <div class="login-brand-icon error-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 4.2 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0Z"></path></svg>
        </div>
        <p class="error-status" th:text="${status}" data-testid="error-status">404</p>
        <h1 th:text="${titleKey != null ? #messages.msg(titleKey) : title}" data-testid="error-title">Page not found</h1>
        <p th:text="${messageKey != null ? #messages.msg(messageKey) : message}" data-testid="error-message">The page you requested does not exist.</p>
        <div class="form-actions">
            <a th:href="@{/dashboard}" class="form-save-button" data-testid="error-dashboard-link" th:text="#{nav.dashboard}">Dashboard</a>
            <a th:href="@{/login}" class="form-cancel-button" data-testid="error-login-link" th:text="#{error.login}">Login</a>
        </div>
    </section>
</main>
</body>
</html>
