<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{tasks.form.title}">Task Form - QA Task Manager SUT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/js/ui.js}"></script>
</head>
<body class="dashboard-body" th:attr="data-i18n-no-results=#{empty.results},data-i18n-empty-tasks=#{empty.tasks},data-i18n-empty-issues=#{empty.issues},data-i18n-delete-item=#{modal.delete.item},data-i18n-content-translate=#{contentTranslation.toggle},data-i18n-content-original=#{contentTranslation.showOriginal}">
<div class="dashboard-shell is-sidebar-collapsed task-form-shell">
    <aside th:replace="~{fragments/navigation :: dashboardSidebar('tasks', 'tasks.form.title')}"></aside>
    <div class="dashboard-main-shell">
        <header class="dashboard-topbar">
            <button type="button" class="dashboard-menu-button" data-testid="dashboard-sidebar-toggle" th:attr="aria-label=#{common.toggleSidebar}" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></button>
            <strong><a th:href="@{/tasks}" class="topbar-crumb" th:text="#{tasks.title}">Tasks</a><span>/</span><span th:text="${taskId == null ? #messages.msg('tasks.form.createTitle') : #messages.msg('tasks.form.editTitle')}"></span></strong>
            <div th:replace="~{fragments/navigation :: topbarActions}"></div>
        </header>
        <main class="dashboard-page app-form-page">
            <section class="app-page-heading">
                <h1 th:text="${taskId == null ? #messages.msg('tasks.form.createTitle') : #messages.msg('tasks.form.editTitle')}" data-testid="task-form-title"></h1>
                <p th:text="${taskId == null ? #messages.msg('tasks.form.createSubtitle') : #messages.msg('tasks.form.editSubtitle')}"></p>
            </section>
            <form th:action="${taskId == null} ? @{/tasks} : @{/tasks/{id}(id=${taskId})}" th:object="${task}" method="post" class="app-form-card task-edit-form" data-testid="task-form">
                <div class="form-field">
                    <label for="title"><span th:text="#{common.title}">Title</span> <span>*</span></label>
                    <input id="title" th:field="*{title}" maxlength="100" th:placeholder="#{tasks.form.titlePlaceholder}" placeholder="Enter task title" data-testid="task-title-input">
                    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="field-error" data-testid="title-validation-message"></div>
                </div>
                <div class="form-field"><label for="status"><span th:text="#{common.status}">Status</span> <span>*</span></label><select id="status" th:field="*{status}" data-testid="task-status-select"><option th:each="status : ${statuses}" th:value="${status}" th:text="${#messages.msg('task.status.' + status)}"></option></select><div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="field-error" data-testid="status-validation-message"></div></div>
                <div class="form-field"><label for="priority"><span th:text="#{common.priority}">Priority</span> <span>*</span></label><select id="priority" th:field="*{priority}" data-testid="task-priority-select"><option th:each="priority : ${priorities}" th:value="${priority}" th:text="${#messages.msg('task.priority.' + priority)}"></option></select><div th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}" class="field-error" data-testid="priority-validation-message"></div></div>
                <div class="form-field"><label for="dueDate"><span th:text="#{common.dueDate}">Due date</span> <span>*</span></label><input id="dueDate" th:field="*{dueDate}" type="date" data-testid="task-due-date-input"><div th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}" class="field-error" data-testid="due-date-validation-message"></div></div>
                <div class="form-actions">
                    <button type="submit" class="form-save-button" data-testid="save-task-button" th:text="#{common.save}">Save</button>
                    <a th:href="@{/tasks}" class="form-cancel-button" data-testid="cancel-task-link" th:text="#{common.cancel}">Cancel</a>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
