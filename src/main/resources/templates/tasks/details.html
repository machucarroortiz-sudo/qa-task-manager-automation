<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|#{tasks.details.title} - #{app.fullName}|">Task Details - QA Task Manager SUT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/js/ui.js}"></script>
</head>
<body class="dashboard-body" th:attr="data-i18n-no-results=#{empty.results},data-i18n-empty-tasks=#{empty.tasks},data-i18n-empty-issues=#{empty.issues},data-i18n-delete-item=#{modal.delete.item},data-i18n-content-translate=#{contentTranslation.toggle},data-i18n-content-original=#{contentTranslation.showOriginal}">
<div class="dashboard-shell is-sidebar-collapsed task-details-shell">
    <aside th:replace="~{fragments/navigation :: dashboardSidebar('tasks', 'tasks.details.title')}"></aside>
    <div class="dashboard-main-shell">
        <header class="dashboard-topbar">
            <button type="button" class="dashboard-menu-button" data-testid="dashboard-sidebar-toggle" th:attr="aria-label=#{common.toggleSidebar}" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></button>
            <strong><a th:href="@{/tasks}" class="topbar-crumb" th:text="#{tasks.title}">Tasks</a><span>/</span><span th:text="#{tasks.details.title}">Task Details</span></strong>
            <div th:replace="~{fragments/navigation :: topbarActions}"></div>
        </header>
        <main class="dashboard-page details-page">
            <section class="app-page-heading">
                <h1 data-testid="task-details-title" th:text="#{tasks.details.title}">Task Details</h1>
                <p th:text="#{tasks.details.subtitle}">View task information and details.</p>
                <div class="content-translation-control" data-testid="content-translation-control">
                    <button type="button" class="content-translation-toggle" data-content-translation-toggle data-testid="content-translation-toggle" th:text="#{contentTranslation.toggle}">Translate content</button>
                    <span class="tooltip-wrapper">
                        <button type="button" class="tooltip-icon" data-testid="content-translation-tooltip-icon" th:attr="aria-label=#{contentTranslation.tooltip}">i</button>
                        <span class="tooltip-bubble" role="tooltip" th:text="#{contentTranslation.tooltip}">Assisted translation for user-entered content.</span>
                    </span>
                </div>
            </section>
            <div th:if="${successMessageKey != null or successMessage != null}" class="alert success task-page-alert" th:text="${successMessageKey != null ? #messages.msg(successMessageKey) : successMessage}" data-testid="success-message"></div>
            <section class="detail-card" data-testid="task-details">
                <div class="detail-row"><span class="profile-row-icon">#</span><strong th:text="#{common.id}">ID</strong><span th:text="${task.id()}" data-testid="task-id"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h10"></path><path d="M7 12h8"></path><path d="M7 16h6"></path><path d="M5 3h14v18H5z"></path></svg></span><strong th:text="#{common.title}">Title</strong><span th:text="${task.title()}" data-content-translatable="true" data-testid="task-title"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4"></path><path d="M12 18v4"></path><path d="m4.93 4.93 2.83 2.83"></path><path d="m16.24 16.24 2.83 2.83"></path><path d="M2 12h4"></path><path d="M18 12h4"></path></svg></span><strong th:text="#{common.status}">Status</strong><span th:text="${#messages.msg('task.status.' + task.status())}" th:class="'status-badge status-' + ${task.status()}" data-testid="task-status"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></span><strong th:text="#{common.priority}">Priority</strong><span class="priority-badge" th:classappend="' priority-badge-' + ${task.priority()}" th:text="${#messages.msg('task.priority.' + task.priority())}" data-testid="task-priority"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z"></path></svg></span><strong th:text="#{common.dueDate}">Due date</strong><span th:text="${task.dueDate()}" data-testid="task-due-date"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span><strong th:text="#{common.owner}">Owner</strong><span th:text="${task.ownerEmail()}" data-testid="task-owner"></span></div>
            </section>
            <div class="form-actions details-actions"><a th:href="@{/tasks/{id}/edit(id=${task.id()})}" class="form-save-button" data-testid="edit-task-link" th:text="#{common.edit}">Edit</a><a th:href="@{/tasks}" class="form-cancel-button" data-testid="back-to-tasks-link" th:text="#{common.back}">Back</a></div>
        </main>
    </div>
</div>
</body>
</html>
