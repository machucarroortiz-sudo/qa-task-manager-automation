<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{tasks.title} + ' - ' + #{app.fullName}">Tasks - QA Task Manager SUT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/js/ui.js}"></script>
</head>
<body class="dashboard-body" th:attr="data-i18n-no-results=#{empty.results},data-i18n-empty-tasks=#{empty.tasks},data-i18n-empty-issues=#{empty.issues},data-i18n-delete-item=#{modal.delete.item},data-i18n-content-translate=#{contentTranslation.toggle},data-i18n-content-original=#{contentTranslation.showOriginal}">
<div class="dashboard-shell is-sidebar-collapsed tasks-shell">
    <aside th:replace="~{fragments/navigation :: dashboardSidebar('tasks', 'tasks.title')}"></aside>

    <div class="dashboard-main-shell">
        <header class="dashboard-topbar">
            <button type="button" class="dashboard-menu-button" data-testid="dashboard-sidebar-toggle" th:attr="aria-label=#{common.toggleSidebar}" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
            </button>
            <strong th:text="#{tasks.title}">Tasks</strong>
            <div th:replace="~{fragments/navigation :: topbarActions}"></div>
        </header>

        <main class="dashboard-page tasks-page">
            <section class="tasks-page-heading">
                <div>
                    <h1 data-testid="task-list-title" th:text="#{tasks.pageTitle}">My Tasks</h1>
                    <p th:text="#{tasks.subtitle}">Manage, track, and complete your tasks.</p>
                </div>
                <div class="tasks-page-actions">
                    <a th:href="@{/tasks/new}" class="tasks-action-primary" data-testid="create-task-link">
                        <span aria-hidden="true">+</span>
                        <span th:text="#{tasks.new}">New task</span>
                    </a>
                    <a th:if="${isAdmin}" th:href="@{/admin}" class="tasks-action-primary tasks-action-solid" data-testid="admin-dashboard-link" th:text="#{tasks.adminDashboard}">Admin dashboard</a>
                </div>
            </section>

            <div th:if="${successMessageKey != null or successMessage != null}" class="alert success task-page-alert" th:text="${successMessageKey != null ? #messages.msg(successMessageKey) : successMessage}" data-testid="success-message"></div>
            <div class="toast" data-testid="toast-notification" role="status"></div>

            <section class="tasks-filter-card" data-testid="task-filters">
                <label for="taskStatusFilter" th:text="#{common.status}">Status</label>
                <select id="taskStatusFilter" data-testid="task-status-filter">
                    <option value="" th:selected="${selectedStatus == null}" th:text="#{tasks.allStatuses}">All statuses</option>
                    <option value="TODO" th:selected="${selectedStatus != null and selectedStatus.name() == 'TODO'}" th:text="#{task.status.TODO}">TODO</option>
                    <option value="IN_PROGRESS" th:selected="${selectedStatus != null and selectedStatus.name() == 'IN_PROGRESS'}" th:text="#{task.status.IN_PROGRESS}">IN_PROGRESS</option>
                    <option value="DONE" th:selected="${selectedStatus != null and selectedStatus.name() == 'DONE'}" th:text="#{task.status.DONE}">DONE</option>
                    <option value="CANCELLED" th:selected="${selectedStatus != null and selectedStatus.name() == 'CANCELLED'}" th:text="#{task.status.CANCELLED}">CANCELLED</option>
                </select>

                <button type="button" class="tasks-clear-button" data-testid="clear-task-filters-button" th:text="#{common.clearFilters}">Clear filters</button>
            </section>

            <section class="tasks-table-card">
                <table class="tasks-table" data-testid="task-table">
                    <thead>
                    <tr>
                        <th><button type="button" class="sort-header" data-sort-key="title" data-testid="task-sort-title"><span th:text="#{common.title}">Title</span> <span data-sort-indicator="title" data-testid="task-sort-title-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="status" data-testid="task-sort-status"><span th:text="#{common.status}">Status</span> <span data-sort-indicator="status" data-testid="task-sort-status-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="priority" data-testid="task-sort-priority"><span th:text="#{common.priority}">Priority</span> <span data-sort-indicator="priority" data-testid="task-sort-priority-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="dueDate" data-testid="task-sort-due-date"><span th:text="#{common.dueDate}">Due date</span> <span data-sort-indicator="dueDate" data-testid="task-sort-due-date-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="owner" data-testid="task-sort-owner"><span th:text="#{common.owner}">Owner</span> <span data-sort-indicator="owner" data-testid="task-sort-owner-indicator"></span></button></th>
                        <th th:text="#{common.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="task : ${tasks}"
                        th:attr="data-testid='task-row-' + ${task.id()},data-status=${task.status()},data-title=${task.title()},data-sort-title=${task.title()},data-sort-status=${task.status()},data-sort-priority=${task.priority()},data-sort-dueDate=${task.dueDate()},data-sort-owner=${task.ownerEmail()}">
                        <td class="task-title-cell" th:text="${task.title()}" th:attr="data-testid='task-title-' + ${task.id()}"></td>
                        <td>
                            <span th:text="${#messages.msg('task.status.' + task.status())}"
                                  th:class="'status-badge status-' + ${task.status()}"
                                  th:attr="data-testid='task-status-' + ${task.id()}"></span>
                        </td>
                        <td th:attr="data-testid='task-priority-' + ${task.id()}">
                            <span th:class="'priority-dot priority-' + ${task.priority()}"></span>
                            <span th:text="${#messages.msg('task.priority.' + task.priority())}"></span>
                        </td>
                        <td th:text="${task.dueDate()}" th:attr="data-testid='task-due-date-' + ${task.id()}"></td>
                        <td th:text="${task.ownerEmail()}" th:attr="data-testid='task-owner-' + ${task.id()}"></td>
                        <td class="row-actions tasks-row-actions">
                            <a th:href="@{/tasks/{id}(id=${task.id()})}" class="task-row-button task-row-button-outline" th:attr="data-testid='view-task-' + ${task.id()}" th:text="#{common.view}">View</a>
                            <a th:href="@{/tasks/{id}/edit(id=${task.id()})}" class="task-row-button task-row-button-outline" th:attr="data-testid='edit-task-' + ${task.id()}" th:text="#{common.edit}">Edit</a>
                            <form th:action="@{/tasks/{id}/complete(id=${task.id()})}" method="post">
                                <button type="submit" class="task-row-button task-row-button-muted" th:attr="data-testid='complete-task-' + ${task.id()}" th:text="#{common.complete}">Complete</button>
                            </form>
                            <form th:action="@{/tasks/{id}/delete(id=${task.id()})}" method="post">
                                <button type="submit" class="task-row-button task-row-button-danger" data-confirm-delete="true"
                                        th:attr="data-testid='delete-task-' + ${task.id()},data-confirm-message=#{modal.delete.task}" th:text="#{common.delete}">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr class="empty-table-row" data-testid="task-empty-state-row" th:hidden="${!#lists.isEmpty(tasks)}">
                        <td colspan="6" th:text="#{empty.tasks}">No tasks found.</td>
                    </tr>
                    </tbody>
                </table>
                <div class="tasks-table-footer">
                    <span th:text="#{pagination.tasks(${firstItem}, ${lastItem}, ${taskPage.totalElements()})}" data-testid="task-pagination-summary"></span>
                    <div class="tasks-pagination" data-testid="task-pagination">
                        <span th:if="${taskPage.first()}">&lsaquo;</span>
                        <a th:if="${!taskPage.first()}" th:href="@{/tasks(page=${taskPage.page() - 1},size=${taskPage.size()},status=${selectedStatus},search=${search})}" data-testid="task-pagination-prev">&lsaquo;</a>
                        <a th:each="pageNumber : ${pageNumbers}"
                           th:href="@{/tasks(page=${pageNumber},size=${taskPage.size()},status=${selectedStatus},search=${search})}"
                           th:text="${pageNumber + 1}"
                           th:classappend="${pageNumber == taskPage.page()} ? ' is-active'"
                           th:attr="data-testid='task-pagination-page-' + ${pageNumber + 1}"></a>
                        <span th:if="${taskPage.last()}">&rsaquo;</span>
                        <a th:if="${!taskPage.last()}" th:href="@{/tasks(page=${taskPage.page() + 1},size=${taskPage.size()},status=${selectedStatus},search=${search})}" data-testid="task-pagination-next">&rsaquo;</a>
                    </div>
                </div>
            </section>

            <div class="modal-backdrop" data-testid="delete-confirmation-modal" role="dialog" aria-modal="true">
                <div class="modal">
                    <p data-testid="delete-confirmation-message" th:text="#{modal.delete.task}">Delete this task?</p>
                    <div class="actions">
                        <button type="button" class="secondary" data-testid="delete-cancel-button" th:text="#{common.cancel}">Cancel</button>
                        <button type="button" class="danger" data-testid="delete-confirm-button" th:text="#{common.confirm}">Confirm</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
