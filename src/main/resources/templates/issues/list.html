<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Issues - QA Task Manager SUT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/js/ui.js}"></script>
</head>
<body class="dashboard-body">
<div class="dashboard-shell is-sidebar-collapsed issues-shell">
    <aside class="dashboard-sidebar" data-testid="dashboard-navigation">
        <a th:href="@{/dashboard}" class="dashboard-brand" data-testid="nav-dashboard-brand-link">
            <span class="dashboard-brand-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 4h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"></path>
                    <path d="M9 12l2 2 4-5"></path>
                    <path d="M9 7h6"></path>
                </svg>
            </span>
            <span>
                <strong>QA Task Manager</strong>
                <small>SUT</small>
            </span>
        </a>

        <nav class="dashboard-side-nav" aria-label="Issues navigation">
            <a th:href="@{/dashboard}" data-testid="nav-dashboard-link">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4z"></path><path d="M13 4h7v7h-7z"></path><path d="M4 13h7v7H4z"></path><path d="M13 13h7v7h-7z"></path></svg>
                Dashboard
            </a>
            <a th:href="@{/tasks}" data-testid="nav-tasks-link">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12"></path><path d="M8 12h12"></path><path d="M8 18h12"></path><path d="M4 6h.01"></path><path d="M4 12h.01"></path><path d="M4 18h.01"></path></svg>
                Tasks
            </a>
            <a th:href="@{/issues}" class="is-active" data-testid="nav-issues-link">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 4.2 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0Z"></path></svg>
                Issues
            </a>
            <a th:href="@{/admin}" data-testid="nav-admin-link">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Users/Admin
            </a>
            <a th:if="${isAdmin}" th:href="@{/settings}" data-testid="nav-settings-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 0 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 0 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 0 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1a2 2 0 0 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z"></path></svg>Settings</a>
        </nav>

        <div class="dashboard-sidebar-spacer" aria-hidden="true"></div>
    </aside>

    <div class="dashboard-main-shell">
        <header class="dashboard-topbar">
            <button type="button" class="dashboard-menu-button" data-testid="dashboard-sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
            </button>
            <strong>Issues</strong>
            <div class="dashboard-topbar-actions">
                <div class="dashboard-search">
                    <input type="search" placeholder="Search..." data-testid="global-search-input" aria-label="Global search">
                    <svg viewBox="0 0 24 24" role="img" aria-label="Search icon">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m16 16 4 4"></path>
                    </svg>
                </div>
                <div class="notification-panel">
                    <button type="button" class="notification-bell" data-testid="notification-bell" aria-expanded="false" aria-controls="notification-dropdown">
                        <svg viewBox="0 0 24 24" role="img" aria-label="Notifications">
                            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                            <path d="M10 21h4"></path>
                        </svg>
                        <span class="notification-badge" data-testid="unread-notification-badge" th:text="${unreadNotificationCount}" th:hidden="${unreadNotificationCount == 0}"></span>
                    </button>
                    <section id="notification-dropdown" class="notification-dropdown" data-testid="notification-dropdown" hidden>
                        <div class="notification-dropdown-header">
                            <strong>Notifications</strong>
                            <span th:text="${unreadNotificationCount + ' unread'}"></span>
                        </div>
                        <p class="notification-empty" th:if="${#lists.isEmpty(notifications)}">No unread notifications.</p>
                        <article class="notification-item" data-testid="notification-item" th:each="notification : ${notifications}">
                            <div>
                                <span class="notification-type" th:text="${notification.type()}"></span>
                                <p th:text="${notification.message()}"></p>
                                <small th:text="${notification.createdAt()}"></small>
                            </div>
                            <form th:action="@{/dashboard/notifications/{id}/read(id=${notification.id()})}" method="post">
                                <button type="submit" class="notification-read-button" data-testid="mark-notification-read-button">Read</button>
                            </form>
                        </article>
                    </section>
                </div>
                <a th:href="@{/profile}" class="dashboard-topbar-user" data-testid="nav-profile-link">
                    <span class="dashboard-avatar" th:text="${#strings.substring(currentUser.email, 0, 1).toUpperCase()}"></span>
                    <span>
                        <strong th:text="${currentUser.email}"></strong>
                        <small th:text="${currentUser.role}"></small>
                    </span>
                </a>
                <form th:action="@{/logout}" method="post" data-testid="nav-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="dashboard-topbar-logout" data-testid="nav-logout-button" aria-label="Log out">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
                    </button>
                </form>
            </div>
        </header>

        <main class="dashboard-page issues-page">
            <section class="issues-page-heading">
                <div>
                    <h1 data-testid="issue-list-title">Issues</h1>
                    <p>Track and manage all issues reported in the system.</p>
                </div>
                <a th:href="@{/issues/new}" class="tasks-action-primary tasks-action-solid" data-testid="create-issue-link">
                    <span aria-hidden="true">+</span>
                    New issue
                </a>
            </section>

            <div th:if="${successMessage}" class="alert success task-page-alert" th:text="${successMessage}" data-testid="success-message"></div>
            <div class="toast" data-testid="toast-notification" role="status"></div>

            <section class="issues-filter-card" data-testid="issue-filters">
                <div>
                    <label for="issueStatusFilter">Status</label>
                    <select id="issueStatusFilter" data-testid="issue-status-filter">
                        <option value="" th:selected="${selectedStatus == null}">All statuses</option>
                        <option value="OPEN" th:selected="${selectedStatus != null and selectedStatus.name() == 'OPEN'}">OPEN</option>
                        <option value="IN_PROGRESS" th:selected="${selectedStatus != null and selectedStatus.name() == 'IN_PROGRESS'}">IN_PROGRESS</option>
                        <option value="BLOCKED" th:selected="${selectedStatus != null and selectedStatus.name() == 'BLOCKED'}">BLOCKED</option>
                        <option value="RESOLVED" th:selected="${selectedStatus != null and selectedStatus.name() == 'RESOLVED'}">RESOLVED</option>
                        <option value="CLOSED" th:selected="${selectedStatus != null and selectedStatus.name() == 'CLOSED'}">CLOSED</option>
                        <option value="CANCELLED" th:selected="${selectedStatus != null and selectedStatus.name() == 'CANCELLED'}">CANCELLED</option>
                    </select>
                </div>

                <div>
                    <label for="issuePriorityFilter">Priority</label>
                    <select id="issuePriorityFilter" data-testid="issue-priority-filter">
                        <option value="" th:selected="${selectedPriority == null}">All priorities</option>
                        <option value="LOW" th:selected="${selectedPriority != null and selectedPriority.name() == 'LOW'}">LOW</option>
                        <option value="MEDIUM" th:selected="${selectedPriority != null and selectedPriority.name() == 'MEDIUM'}">MEDIUM</option>
                        <option value="HIGH" th:selected="${selectedPriority != null and selectedPriority.name() == 'HIGH'}">HIGH</option>
                        <option value="CRITICAL" th:selected="${selectedPriority != null and selectedPriority.name() == 'CRITICAL'}">CRITICAL</option>
                    </select>
                </div>

                <div class="issues-title-filter">
                    <label for="issueTitleSearch">Title</label>
                    <input id="issueTitleSearch" type="search" placeholder="Search title..." th:value="${search}" data-testid="issue-title-search">
                </div>

                <button type="button" class="tasks-clear-button" data-testid="clear-issue-filters-button">Clear filters</button>
            </section>

            <section class="issues-table-card">
                <table class="issues-table" data-testid="issue-table">
                    <thead>
                    <tr>
                        <th><button type="button" class="sort-header" data-sort-key="title" data-testid="issue-sort-title">Title <span data-sort-indicator="title" data-testid="issue-sort-title-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="status" data-testid="issue-sort-status">Status <span data-sort-indicator="status" data-testid="issue-sort-status-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="priority" data-testid="issue-sort-priority">Priority <span data-sort-indicator="priority" data-testid="issue-sort-priority-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="startDate" data-testid="issue-sort-start">Start <span data-sort-indicator="startDate" data-testid="issue-sort-start-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="endDate" data-testid="issue-sort-end">End <span data-sort-indicator="endDate" data-testid="issue-sort-end-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="creator" data-testid="issue-sort-creator">Creator <span data-sort-indicator="creator" data-testid="issue-sort-creator-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="assigned" data-testid="issue-sort-assigned">Assigned <span data-sort-indicator="assigned" data-testid="issue-sort-assigned-indicator"></span></button></th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="issue : ${issues}"
                        th:attr="data-testid='issue-row-' + ${issue.id()},data-status=${issue.status()},data-priority=${issue.priority()},data-title=${issue.title()},data-labels=${#strings.listJoin(issue.labels().![name()], ' ')},data-sort-title=${issue.title()},data-sort-status=${issue.status()},data-sort-priority=${issue.priority()},data-sort-startDate=${issue.startDate()},data-sort-endDate=${issue.endDate()},data-sort-creator=${issue.creatorEmail()},data-sort-assigned=${issue.assignedUserEmail()}">
                        <td class="issue-title-cell" th:text="${issue.title()}" th:attr="data-testid='issue-title-' + ${issue.id()}"></td>
                        <td>
                            <span th:text="${issue.status()}"
                                  th:class="'status-badge status-' + ${issue.status()}"
                                  th:attr="data-testid='issue-status-' + ${issue.id()}"></span>
                        </td>
                        <td th:attr="data-testid='issue-priority-' + ${issue.id()}">
                            <span th:class="'priority-dot priority-' + ${issue.priority()}"></span>
                            <span th:text="${issue.priority()}"></span>
                        </td>
                        <td th:text="${issue.startDate()}"></td>
                        <td th:text="${issue.endDate()}"></td>
                        <td th:text="${issue.creatorEmail()}"></td>
                        <td th:text="${issue.assignedUserEmail()}"></td>
                        <td class="row-actions issues-row-actions">
                            <a th:href="@{/issues/{id}(id=${issue.id()})}" class="task-row-button task-row-button-outline" th:attr="data-testid='view-issue-' + ${issue.id()}">View</a>
                            <a th:href="@{/issues/{id}/edit(id=${issue.id()})}" class="task-row-button task-row-button-outline" th:attr="data-testid='edit-issue-' + ${issue.id()}">Edit</a>
                            <form th:action="@{/issues/{id}/delete(id=${issue.id()})}" method="post">
                                <button type="submit" class="task-row-button task-row-button-danger" data-confirm-delete="true"
                                        th:attr="data-testid='delete-issue-' + ${issue.id()},data-confirm-message='Delete issue ' + ${issue.id()} + '?'">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr class="empty-table-row" data-testid="issue-empty-state-row" th:hidden="${!#lists.isEmpty(issues)}">
                        <td colspan="8">No issues found.</td>
                    </tr>
                    </tbody>
                </table>
                <div class="issues-table-footer">
                    <span th:text="'Showing ' + ${firstItem} + ' to ' + ${lastItem} + ' of ' + ${issuePage.totalElements()} + ' issues'" data-testid="issue-pagination-summary"></span>
                    <div class="tasks-pagination" data-testid="issue-pagination">
                        <span th:if="${issuePage.first()}">&lsaquo;</span>
                        <a th:if="${!issuePage.first()}" th:href="@{/issues(page=${issuePage.page() - 1},size=${issuePage.size()},status=${selectedStatus},priority=${selectedPriority},search=${search},label=${label})}" data-testid="issue-pagination-prev">&lsaquo;</a>
                        <a th:each="pageNumber : ${pageNumbers}"
                           th:href="@{/issues(page=${pageNumber},size=${issuePage.size()},status=${selectedStatus},priority=${selectedPriority},search=${search},label=${label})}"
                           th:text="${pageNumber + 1}"
                           th:classappend="${pageNumber == issuePage.page()} ? ' is-active'"
                           th:attr="data-testid='issue-pagination-page-' + ${pageNumber + 1}"></a>
                        <span th:if="${issuePage.last()}">&rsaquo;</span>
                        <a th:if="${!issuePage.last()}" th:href="@{/issues(page=${issuePage.page() + 1},size=${issuePage.size()},status=${selectedStatus},priority=${selectedPriority},search=${search},label=${label})}" data-testid="issue-pagination-next">&rsaquo;</a>
                    </div>
                </div>
            </section>

            <div class="modal-backdrop" data-testid="delete-confirmation-modal" role="dialog" aria-modal="true">
                <div class="modal">
                    <p data-testid="delete-confirmation-message">Delete this issue?</p>
                    <div class="actions">
                        <button type="button" class="secondary" data-testid="delete-cancel-button">Cancel</button>
                        <button type="button" class="danger" data-testid="delete-confirm-button">Confirm</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
