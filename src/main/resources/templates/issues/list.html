<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|#{issues.title} - #{app.fullName}|">Issues - QA Task Manager SUT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/js/ui.js}"></script>
</head>
<body class="dashboard-body" th:attr="data-i18n-no-results=#{empty.results},data-i18n-empty-tasks=#{empty.tasks},data-i18n-empty-issues=#{empty.issues},data-i18n-delete-item=#{modal.delete.item},data-i18n-content-translate=#{contentTranslation.toggle},data-i18n-content-original=#{contentTranslation.showOriginal}">
<div class="dashboard-shell is-sidebar-collapsed issues-shell">
    <aside th:replace="~{fragments/navigation :: dashboardSidebar('issues', 'issues.title')}"></aside>

    <div class="dashboard-main-shell">
        <header class="dashboard-topbar">
            <button type="button" class="dashboard-menu-button" data-testid="dashboard-sidebar-toggle" th:attr="aria-label=#{common.toggleSidebar}" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
            </button>
            <strong th:text="#{issues.title}">Issues</strong>
            <div th:replace="~{fragments/navigation :: topbarActions}"></div>
        </header>

        <main class="dashboard-page issues-page">
            <section class="issues-page-heading">
                <div>
                    <h1 data-testid="issue-list-title" th:text="#{issues.title}">Issues</h1>
                    <p th:text="#{issues.subtitle}">Track and manage all issues reported in the system.</p>
                </div>
                <a th:href="@{/issues/new}" class="tasks-action-primary tasks-action-solid" data-testid="create-issue-link">
                    <span aria-hidden="true">+</span>
                    <span th:text="#{issues.new}">New issue</span>
                </a>
            </section>

            <div th:if="${successMessageKey != null or successMessage != null}" class="alert success task-page-alert" th:text="${successMessageKey != null ? #messages.msg(successMessageKey) : successMessage}" data-testid="success-message"></div>
            <div class="toast" data-testid="toast-notification" role="status"></div>

            <section class="issues-filter-card" data-testid="issue-filters">
                <div>
                    <label for="issueStatusFilter" th:text="#{common.status}">Status</label>
                    <select id="issueStatusFilter" data-testid="issue-status-filter">
                        <option value="" th:selected="${selectedStatus == null}" th:text="#{issues.allStatuses}">All statuses</option>
                        <option value="OPEN" th:selected="${selectedStatus != null and selectedStatus.name() == 'OPEN'}" th:text="#{issue.status.OPEN}">OPEN</option>
                        <option value="IN_PROGRESS" th:selected="${selectedStatus != null and selectedStatus.name() == 'IN_PROGRESS'}" th:text="#{issue.status.IN_PROGRESS}">IN_PROGRESS</option>
                        <option value="BLOCKED" th:selected="${selectedStatus != null and selectedStatus.name() == 'BLOCKED'}" th:text="#{issue.status.BLOCKED}">BLOCKED</option>
                        <option value="RESOLVED" th:selected="${selectedStatus != null and selectedStatus.name() == 'RESOLVED'}" th:text="#{issue.status.RESOLVED}">RESOLVED</option>
                        <option value="CLOSED" th:selected="${selectedStatus != null and selectedStatus.name() == 'CLOSED'}" th:text="#{issue.status.CLOSED}">CLOSED</option>
                        <option value="CANCELLED" th:selected="${selectedStatus != null and selectedStatus.name() == 'CANCELLED'}" th:text="#{issue.status.CANCELLED}">CANCELLED</option>
                    </select>
                </div>

                <div>
                    <label for="issuePriorityFilter" th:text="#{common.priority}">Priority</label>
                    <select id="issuePriorityFilter" data-testid="issue-priority-filter">
                        <option value="" th:selected="${selectedPriority == null}" th:text="#{issues.allPriorities}">All priorities</option>
                        <option value="LOW" th:selected="${selectedPriority != null and selectedPriority.name() == 'LOW'}" th:text="#{issue.priority.LOW}">LOW</option>
                        <option value="MEDIUM" th:selected="${selectedPriority != null and selectedPriority.name() == 'MEDIUM'}" th:text="#{issue.priority.MEDIUM}">MEDIUM</option>
                        <option value="HIGH" th:selected="${selectedPriority != null and selectedPriority.name() == 'HIGH'}" th:text="#{issue.priority.HIGH}">HIGH</option>
                        <option value="CRITICAL" th:selected="${selectedPriority != null and selectedPriority.name() == 'CRITICAL'}" th:text="#{issue.priority.CRITICAL}">CRITICAL</option>
                    </select>
                </div>

                <div class="issues-title-filter">
                    <label for="issueTitleSearch" th:text="#{common.title}">Title</label>
                    <input id="issueTitleSearch" type="search" th:placeholder="#{issues.searchTitlePlaceholder}" placeholder="Search title..." th:value="${search}" data-testid="issue-title-search">
                </div>

                <button type="button" class="tasks-clear-button" data-testid="clear-issue-filters-button" th:text="#{common.clearFilters}">Clear filters</button>
            </section>

            <section class="issues-table-card">
                <table class="issues-table" data-testid="issue-table">
                    <thead>
                    <tr>
                        <th><button type="button" class="sort-header" data-sort-key="title" data-testid="issue-sort-title"><span th:text="#{common.title}">Title</span> <span data-sort-indicator="title" data-testid="issue-sort-title-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="status" data-testid="issue-sort-status"><span th:text="#{common.status}">Status</span> <span data-sort-indicator="status" data-testid="issue-sort-status-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="priority" data-testid="issue-sort-priority"><span th:text="#{common.priority}">Priority</span> <span data-sort-indicator="priority" data-testid="issue-sort-priority-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="startDate" data-testid="issue-sort-start"><span th:text="#{common.start}">Start</span> <span data-sort-indicator="startDate" data-testid="issue-sort-start-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="endDate" data-testid="issue-sort-end"><span th:text="#{common.end}">End</span> <span data-sort-indicator="endDate" data-testid="issue-sort-end-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="creator" data-testid="issue-sort-creator"><span th:text="#{common.creator}">Creator</span> <span data-sort-indicator="creator" data-testid="issue-sort-creator-indicator"></span></button></th>
                        <th><button type="button" class="sort-header" data-sort-key="assigned" data-testid="issue-sort-assigned"><span th:text="#{common.assigned}">Assigned</span> <span data-sort-indicator="assigned" data-testid="issue-sort-assigned-indicator"></span></button></th>
                        <th th:text="#{common.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="issue : ${issues}"
                        th:attr="data-testid='issue-row-' + ${issue.id()},data-status=${issue.status()},data-priority=${issue.priority()},data-title=${issue.title()},data-labels=${#strings.listJoin(issue.labels().![name()], ' ')},data-sort-title=${issue.title()},data-sort-status=${issue.status()},data-sort-priority=${issue.priority()},data-sort-startDate=${issue.startDate()},data-sort-endDate=${issue.endDate()},data-sort-creator=${issue.creatorEmail()},data-sort-assigned=${issue.assignedUserEmail()}">
                        <td class="issue-title-cell" th:text="${issue.title()}" th:attr="data-testid='issue-title-' + ${issue.id()}"></td>
                        <td>
                            <span th:text="${#messages.msg('issue.status.' + issue.status())}"
                                  th:class="'status-badge status-' + ${issue.status()}"
                                  th:attr="data-testid='issue-status-' + ${issue.id()}"></span>
                        </td>
                        <td th:attr="data-testid='issue-priority-' + ${issue.id()}">
                            <span th:class="'priority-dot priority-' + ${issue.priority()}"></span>
                            <span th:text="${#messages.msg('issue.priority.' + issue.priority())}"></span>
                        </td>
                        <td th:text="${issue.startDate()}"></td>
                        <td th:text="${issue.endDate()}"></td>
                        <td th:text="${issue.creatorEmail()}"></td>
                        <td th:text="${issue.assignedUserEmail()}"></td>
                        <td class="row-actions issues-row-actions">
                            <a th:href="@{/issues/{id}(id=${issue.id()})}" class="task-row-button task-row-button-outline" th:attr="data-testid='view-issue-' + ${issue.id()}" th:text="#{common.view}">View</a>
                            <a th:href="@{/issues/{id}/edit(id=${issue.id()})}" class="task-row-button task-row-button-outline" th:attr="data-testid='edit-issue-' + ${issue.id()}" th:text="#{common.edit}">Edit</a>
                            <form th:action="@{/issues/{id}/delete(id=${issue.id()})}" method="post">
                                <button type="submit" class="task-row-button task-row-button-danger" data-confirm-delete="true"
                                        th:attr="data-testid='delete-issue-' + ${issue.id()},data-confirm-message=#{modal.delete.issue}" th:text="#{common.delete}">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr class="empty-table-row" data-testid="issue-empty-state-row" th:hidden="${!#lists.isEmpty(issues)}">
                        <td colspan="8" th:text="#{empty.issues}">No issues found.</td>
                    </tr>
                    </tbody>
                </table>
                <div class="issues-table-footer">
                    <span th:text="#{pagination.issues(${firstItem}, ${lastItem}, ${issuePage.totalElements()})}" data-testid="issue-pagination-summary"></span>
                    <div class="tasks-pagination" data-testid="issue-pagination">
                        <span th:if="${issuePage.first()}">&lsaquo;</span>
                        <a th:if="${!issuePage.first()}" th:href="@{/issues(page=${issuePage.page() - 1},size=${issuePage.size()},status=${selectedStatus},priority=${selectedPriority},search=${search},label=${label})}" data-testid="issue-pagination-prev">&lsaquo;</a>
                        <a th:each="pageNumber : ${pageNumbers}"
                           th:href="@{/issues(page=${pageNumber},size=${issuePage.size()},status=${selectedStatus},priority=${selectedPriority},search=${search},label=${label})}"
                           th:text="${pageNumber + 1}"
                           th:classappend="${pageNumber == issuePage.page()} ? ' is-active'"
                           th:attr="data-testid='issue-pagination-page-' + ${pageNumber + 1}"></a>
                        <span th:if="${issuePage.last()}">&rsaquo;</span>
                        <a th:if="${!issuePage.last()}" th:href="@{/issues(page=${issuePage.page() + 1},size=${issuePage.size()},status=${selectedStatus},priority=${selectedPriority},search=${search},label=${label})}" data-testid="issue-pagination-next">&rsaquo;</a>
                    </div>
                </div>
            </section>

            <div class="modal-backdrop" data-testid="delete-confirmation-modal" role="dialog" aria-modal="true">
                <div class="modal">
                    <p data-testid="delete-confirmation-message" th:text="#{modal.delete.issue}">Delete this issue?</p>
                    <div class="actions">
                        <button type="button" class="secondary" data-testid="delete-cancel-button" th:text="#{common.cancel}">Cancel</button>
                        <button type="button" class="danger" data-testid="delete-confirm-button" th:text="#{common.confirm}">Confirm</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
