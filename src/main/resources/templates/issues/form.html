<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{issues.form.title}">Issue Form - QA Task Manager SUT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/js/ui.js}"></script>
</head>
<body class="dashboard-body" th:attr="data-i18n-no-results=#{empty.results},data-i18n-empty-tasks=#{empty.tasks},data-i18n-empty-issues=#{empty.issues},data-i18n-delete-item=#{modal.delete.item},data-i18n-content-translate=#{contentTranslation.toggle},data-i18n-content-original=#{contentTranslation.showOriginal}">
<div class="dashboard-shell is-sidebar-collapsed issue-form-shell">
    <aside th:replace="~{fragments/navigation :: dashboardSidebar('issues', 'issues.form.title')}"></aside>
    <div class="dashboard-main-shell">
        <header class="dashboard-topbar">
            <button type="button" class="dashboard-menu-button" data-testid="dashboard-sidebar-toggle" th:attr="aria-label=#{common.toggleSidebar}" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></button>
            <strong><a th:href="@{/issues}" class="topbar-crumb" th:text="#{issues.title}">Issues</a><span>/</span><span th:text="${issueId == null ? #messages.msg('issues.form.createTitle') : #messages.msg('issues.form.editTitle')}"></span></strong>
            <div th:replace="~{fragments/navigation :: topbarActions}"></div>
        </header>
        <main class="dashboard-page app-form-page issue-form-page">
            <section class="app-page-heading">
                <h1 th:text="${issueId == null ? #messages.msg('issues.form.createTitle') : #messages.msg('issues.form.editTitle')}" data-testid="issue-form-title"></h1>
                <p th:text="${issueId == null ? #messages.msg('issues.form.createSubtitle') : #messages.msg('issues.form.editSubtitle')}"></p>
            </section>
            <form th:action="${issueId == null} ? @{/issues} : @{/issues/{id}(id=${issueId})}" th:object="${issue}" method="post" class="app-form-card issue-edit-form" data-testid="issue-form">
                <div class="form-field"><label for="title"><span th:text="#{common.title}">Title</span> <span>*</span></label><input id="title" th:field="*{title}" maxlength="120" th:placeholder="#{issues.form.titlePlaceholder}" placeholder="Enter issue title" data-testid="issue-title-input"><div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="field-error" data-testid="issue-title-validation-message"></div></div>
                <div class="form-field"><label for="description"><span th:text="#{common.description}">Description</span> <span>*</span></label><textarea id="description" th:field="*{description}" maxlength="2000" th:placeholder="#{issues.form.descriptionPlaceholder}" placeholder="Enter issue description" data-testid="issue-description-input"></textarea><div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="field-error" data-testid="issue-description-validation-message"></div></div>
                <div class="form-field"><label for="startDate"><span th:text="#{common.startDate}">Start date</span> <span>*</span></label><input id="startDate" th:field="*{startDate}" type="date" data-testid="issue-start-date-input"><div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="field-error" data-testid="issue-start-date-validation-message"></div></div>
                <div class="form-field"><label for="endDate" th:text="#{common.endDate}">End date</label><input id="endDate" th:field="*{endDate}" type="date" data-testid="issue-end-date-input"><div th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="field-error" data-testid="issue-end-date-validation-message"></div><div th:if="${#fields.hasErrors('dateRangeValid')}" th:errors="*{dateRangeValid}" class="field-error" data-testid="issue-date-range-validation-message"></div></div>
                <div class="form-field"><label for="assignedUserId"><span th:text="#{common.assigned}">Assigned user</span> <span>*</span></label><select id="assignedUserId" th:field="*{assignedUserId}" data-testid="issue-assigned-user-select"><option value="" th:text="#{common.selectUser}">Select user</option><option th:each="user : ${users}" th:value="${user.id}" th:text="${user.email}"></option></select><div th:if="${#fields.hasErrors('assignedUserId')}" th:errors="*{assignedUserId}" class="field-error" data-testid="issue-assigned-user-validation-message"></div></div>
                <div class="form-field"><label for="status"><span th:text="#{common.status}">Status</span> <span>*</span></label><select id="status" th:field="*{status}" data-testid="issue-status-select"><option th:each="status : ${statuses}" th:value="${status}" th:text="${#messages.msg('issue.status.' + status)}"></option></select></div>
                <div class="form-field"><label for="priority"><span th:text="#{common.priority}">Priority</span> <span>*</span></label><select id="priority" th:field="*{priority}" data-testid="issue-priority-select"><option th:each="priority : ${priorities}" th:value="${priority}" th:text="${#messages.msg('issue.priority.' + priority)}"></option></select></div>
                <fieldset class="form-field checkbox-group issue-label-panel" data-testid="issue-label-checkboxes"><legend th:text="#{common.labels}">Labels</legend><label th:each="label : ${labels}" class="checkbox-label"><input type="checkbox" th:field="*{labelIds}" th:value="${label.id()}" th:attr="data-testid='issue-label-checkbox-' + ${label.id()}"><span th:text="${label.name()}"></span></label></fieldset>
                <div class="form-actions"><button type="submit" class="form-save-button" data-testid="save-issue-button" th:text="#{common.save}">Save</button><a th:href="@{/issues}" class="form-cancel-button" data-testid="cancel-issue-link" th:text="#{common.cancel}">Cancel</a></div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
