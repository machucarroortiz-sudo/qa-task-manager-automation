<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|#{issues.details.title} - #{app.fullName}|">Issue Details - QA Task Manager SUT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/js/ui.js}"></script>
</head>
<body class="dashboard-body" th:attr="data-i18n-no-results=#{empty.results},data-i18n-empty-tasks=#{empty.tasks},data-i18n-empty-issues=#{empty.issues},data-i18n-delete-item=#{modal.delete.item},data-i18n-content-translate=#{contentTranslation.toggle},data-i18n-content-original=#{contentTranslation.showOriginal}">
<div class="dashboard-shell is-sidebar-collapsed issue-details-shell">
    <aside th:replace="~{fragments/navigation :: dashboardSidebar('issues', 'issues.details.title')}"></aside>

    <div class="dashboard-main-shell">
        <header class="dashboard-topbar">
            <button type="button" class="dashboard-menu-button" data-testid="dashboard-sidebar-toggle" th:attr="aria-label=#{common.toggleSidebar}" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></button>
            <strong><a th:href="@{/issues}" class="topbar-crumb" th:text="#{issues.title}">Issues</a><span>/</span><span th:text="#{issues.details.title}">Issue Details</span></strong>
            <div th:replace="~{fragments/navigation :: topbarActions}"></div>
        </header>

        <main class="dashboard-page details-page issue-details-page">
            <section class="app-page-heading">
                <h1 data-testid="issue-details-title" th:text="#{issues.details.title}">Issue Details</h1>
                <p th:text="#{issues.details.subtitle}">View issue information, labels, comments, and attachments.</p>
                <div class="content-translation-control" data-testid="content-translation-control">
                    <button type="button" class="content-translation-toggle" data-content-translation-toggle data-testid="content-translation-toggle" th:text="#{contentTranslation.toggle}">Translate content</button>
                    <span class="tooltip-wrapper">
                        <button type="button" class="tooltip-icon" data-testid="content-translation-tooltip-icon" th:attr="aria-label=#{contentTranslation.tooltip}">i</button>
                        <span class="tooltip-bubble" role="tooltip" th:text="#{contentTranslation.tooltip}">Assisted translation for user-entered content.</span>
                    </span>
                </div>
            </section>
            <div th:if="${successMessageKey != null or successMessage != null}" class="alert success task-page-alert" th:text="${successMessageKey != null ? #messages.msg(successMessageKey) : successMessage}" data-testid="success-message"></div>
            <div th:if="${errorMessageKey != null or errorMessage != null}" class="alert error task-page-alert" th:text="${errorMessageKey != null ? #messages.msg(errorMessageKey) : errorMessage}" data-testid="error-message"></div>
            <div class="toast" data-testid="toast-notification" role="status"></div>

            <section class="detail-card issue-detail-card" data-testid="issue-details">
                <div class="detail-row"><span class="profile-row-icon">#</span><strong th:text="#{common.id}">ID</strong><span th:text="${issue.id()}" data-testid="issue-id"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h10"></path><path d="M7 12h8"></path><path d="M7 16h6"></path><path d="M5 3h14v18H5z"></path></svg></span><strong th:text="#{common.title}">Title</strong><span th:text="${issue.title()}" data-content-translatable="true" data-testid="issue-title"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"></path><path d="M8 9h8"></path><path d="M8 13h6"></path></svg></span><strong th:text="#{common.description}">Description</strong><span th:text="${issue.description()}" data-content-translatable="true" data-testid="issue-description"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4"></path><path d="M12 18v4"></path><path d="M2 12h4"></path><path d="M18 12h4"></path></svg></span><strong th:text="#{common.status}">Status</strong><span th:text="${#messages.msg('issue.status.' + issue.status())}" th:class="'status-badge status-' + ${issue.status()}" data-testid="issue-status"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></span><strong th:text="#{common.priority}">Priority</strong><span class="priority-badge" th:classappend="' priority-badge-' + ${issue.priority()}" th:text="${#messages.msg('issue.priority.' + issue.priority())}" data-testid="issue-priority"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z"></path></svg></span><strong th:text="#{common.startDate}">Start date</strong><span th:text="${issue.startDate()}" data-testid="issue-start-date"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z"></path></svg></span><strong th:text="#{common.endDate}">End date</strong><span th:text="${issue.endDate()}" data-testid="issue-end-date"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span><strong th:text="#{common.creator}">Creator</strong><span th:text="${issue.creatorEmail()}" data-testid="issue-creator"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span><strong th:text="#{common.assigned}">Assigned</strong><span th:text="${issue.assignedUserEmail()}" data-testid="issue-assigned-user"></span></div>
                <div class="detail-row"><span class="profile-row-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.2 13.2 20.6a2 2 0 0 1-2.8 0L3 13.2V3h10.2l7.4 7.4a2 2 0 0 1 0 2.8Z"></path><path d="M7.5 7.5h.01"></path></svg></span><strong th:text="#{common.labels}">Labels</strong><span data-testid="issue-labels"><span th:each="label : ${issue.labels()}" class="label-pill" th:style="'border-color:' + ${label.color()} + '; color:' + ${label.color()}" th:text="${label.name()}"></span></span></div>
            </section>

            <div class="form-actions details-actions"><a th:href="@{/issues/{id}/edit(id=${issue.id()})}" class="form-save-button" data-testid="edit-issue-link" th:text="#{common.edit}">Edit</a><a th:href="@{/issues}" class="form-cancel-button" data-testid="back-to-issues-link" th:text="#{common.back}">Back</a></div>

            <section class="comments-card" data-testid="issue-comments-section">
                <h2 th:text="#{issues.comments}">Comments</h2>
                <form th:action="@{/issues/{id}/comments(id=${issue.id()})}" method="post" class="comment-form" data-testid="add-comment-form">
                    <label for="text" th:text="#{common.comment}">Comment</label>
                    <textarea id="text" name="text" maxlength="1000" data-testid="comment-text-input"></textarea>
                    <button type="submit" class="form-save-button" data-testid="add-comment-button" th:text="#{issues.addComment}">Add comment</button>
                </form>
                <div th:if="${#lists.isEmpty(issue.comments())}" class="empty-state" data-testid="comments-empty-state" th:text="#{empty.comments}">No comments found.</div>
                <article th:each="comment : ${issue.comments()}" class="comment-item" th:attr="data-testid='comment-' + ${comment.id()}">
                    <header><strong th:text="${comment.authorEmail()}" th:attr="data-testid='comment-author-' + ${comment.id()}"></strong><span th:text="${comment.createdAt()}" th:attr="data-testid='comment-created-at-' + ${comment.id()}"></span></header>
                    <p th:text="${comment.text()}" data-content-translatable="true" th:attr="data-testid='comment-text-' + ${comment.id()}"></p>
                    <ul class="attachment-list" data-testid="comment-attachments">
                        <li th:each="attachment : ${comment.attachments()}" th:attr="data-testid='attachment-' + ${attachment.id()}"><a th:href="@{/api/issues/{issueId}/comments/{commentId}/attachments/{attachmentId}(issueId=${issue.id()},commentId=${comment.id()},attachmentId=${attachment.id()})}" th:text="${attachment.fileName()}"></a><span th:text="${attachment.contentType()}"></span><span th:text="#{issues.bytes(${attachment.fileSize()})}"></span></li>
                    </ul>
                    <form th:action="@{/issues/{issueId}/comments/{commentId}/attachments(issueId=${issue.id()},commentId=${comment.id()})}" method="post" enctype="multipart/form-data" class="attachment-form" th:attr="data-testid='attachment-form-' + ${comment.id()}">
                        <input type="file" name="file" accept=".png,.jpg,.jpeg,.mp4" th:attr="data-testid='attachment-file-input-' + ${comment.id()}">
                        <button type="submit" class="task-row-button task-row-button-outline" th:attr="data-testid='upload-attachment-button-' + ${comment.id()}" th:text="#{common.upload}">Upload</button>
                    </form>
                </article>
            </section>
        </main>
    </div>
</div>
</body>
</html>
