<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="main-nav" th:fragment="mainNav" data-testid="main-navigation">
    <div class="nav-left" data-testid="nav-left-group">
        <a th:href="@{/dashboard}" data-testid="nav-dashboard-link">Dashboard</a>
        <a th:href="@{/tasks}" data-testid="nav-tasks-link">Tasks</a>
        <a th:href="@{/issues}" data-testid="nav-issues-link">Issues</a>
        <a th:href="@{/admin}" data-testid="nav-admin-link">Users/Admin</a>
    </div>
    <div class="nav-right" data-testid="nav-right-group">
        <a th:href="@{/profile}" data-testid="nav-profile-link">Profile</a>
        <form th:action="@{/logout}" method="post" data-testid="nav-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="secondary" data-testid="nav-logout-button">Log out</button>
        </form>
    </div>
</nav>
</body>
</html>
