<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{labels.title}">Labels - QA Task Manager SUT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/js/ui.js}"></script>
</head>
<body class="dashboard-body" th:attr="data-i18n-no-results=#{empty.results},data-i18n-empty-tasks=#{empty.tasks},data-i18n-empty-issues=#{empty.issues},data-i18n-delete-item=#{modal.delete.item},data-i18n-content-translate=#{contentTranslation.toggle},data-i18n-content-original=#{contentTranslation.showOriginal}">
<div class="dashboard-shell is-sidebar-collapsed labels-shell">
    <aside th:replace="~{fragments/navigation :: dashboardSidebar('admin', 'labels.title')}"></aside>

    <div class="dashboard-main-shell">
        <header class="dashboard-topbar">
            <button type="button" class="dashboard-menu-button" data-testid="dashboard-sidebar-toggle" th:attr="aria-label=#{common.toggleSidebar}" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
            </button>
            <strong th:text="#{labels.management}">Label Management</strong>
            <div th:replace="~{fragments/navigation :: topbarActions}"></div>
        </header>

        <main class="dashboard-page labels-page">
            <section class="labels-page-heading">
                <h1 data-testid="label-admin-title" th:text="#{labels.management}">Label Management</h1>
                <p th:text="#{labels.subtitle}">Create, update, and manage labels used across tasks and issues.</p>
            </section>

            <div th:if="${successMessageKey != null or successMessage != null}" class="alert success task-page-alert" th:text="${successMessageKey != null ? #messages.msg(successMessageKey) : successMessage}" data-testid="success-message"></div>
            <div th:if="${errorMessageKey != null or errorMessage != null}" class="alert error task-page-alert" th:text="${errorMessageKey != null ? #messages.msg(errorMessageKey) : errorMessage}" data-testid="error-message"></div>
            <div class="toast" data-testid="toast-notification" role="status"></div>

            <section class="label-form-card">
                <h2 th:text="#{labels.createNew}">Create new label</h2>
                <form th:action="@{/admin/labels}" th:object="${label}" method="post" class="label-create-form" data-testid="create-label-form">
                    <div>
                        <label for="name" th:text="#{common.name}">Name</label>
                        <input id="name" th:field="*{name}" th:placeholder="#{labels.namePlaceholder}" placeholder="Enter label name" data-testid="label-name-input">
                        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error" data-testid="label-name-validation-message"></div>
                    </div>

                    <div>
                        <label for="color" th:text="#{common.color}">Color</label>
                        <div class="label-color-control">
                            <span class="label-color-swatch" th:style="'background:' + *{color}"></span>
                            <input id="color" th:field="*{color}" data-testid="label-color-input">
                        </div>
                        <div th:if="${#fields.hasErrors('color')}" th:errors="*{color}" class="field-error" data-testid="label-color-validation-message"></div>
                    </div>

                    <button type="submit" class="label-create-button" data-testid="create-label-button" th:text="#{labels.create}">Create label</button>
                </form>
            </section>

            <section class="label-table-card">
                <h2 th:text="#{labels.existing}">Existing labels</h2>
                <table class="label-table" data-testid="label-table">
                    <thead>
                    <tr>
                        <th th:text="#{common.name}">Name</th>
                        <th th:text="#{common.color}">Color</th>
                        <th th:text="#{common.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="existingLabel : ${labels}" th:attr="data-testid='label-row-' + ${existingLabel.id()}">
                        <td>
                            <form th:id="'label-edit-' + ${existingLabel.id()}" th:action="@{/admin/labels/{id}(id=${existingLabel.id()})}" method="post"></form>
                            <input name="name" th:value="${existingLabel.name()}"
                                   th:attr="form='label-edit-' + ${existingLabel.id()},data-testid='label-name-edit-' + ${existingLabel.id()}">
                        </td>
                        <td>
                            <div class="label-color-control label-color-control-compact">
                                <span class="label-color-swatch" th:style="'background:' + ${existingLabel.color()}"></span>
                                <input name="color" th:value="${existingLabel.color()}"
                                       th:attr="form='label-edit-' + ${existingLabel.id()},data-testid='label-color-edit-' + ${existingLabel.id()}">
                            </div>
                        </td>
                        <td class="label-actions">
                            <button type="submit" class="task-row-button task-row-button-outline"
                                    th:attr="form='label-edit-' + ${existingLabel.id()},data-testid='update-label-' + ${existingLabel.id()}" th:text="#{common.update}">Update</button>
                            <form th:action="@{/admin/labels/{id}/delete(id=${existingLabel.id()})}" method="post">
                                <button type="submit" class="task-row-button task-row-button-danger" th:attr="data-testid='delete-label-' + ${existingLabel.id()}" th:text="#{common.delete}">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr class="empty-table-row" th:if="${#lists.isEmpty(labels)}">
                        <td colspan="3" th:text="#{empty.labels}">No labels found.</td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</div>
</body>
</html>
