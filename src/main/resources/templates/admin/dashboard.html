<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|#{admin.title} - #{app.fullName}|">Admin Dashboard - QA Task Manager SUT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script defer th:src="@{/js/ui.js}"></script>
</head>
<body class="dashboard-body" th:attr="data-i18n-no-results=#{empty.results},data-i18n-empty-tasks=#{empty.tasks},data-i18n-empty-issues=#{empty.issues},data-i18n-delete-item=#{modal.delete.item},data-i18n-content-translate=#{contentTranslation.toggle},data-i18n-content-original=#{contentTranslation.showOriginal}">
<div class="dashboard-shell is-sidebar-collapsed admin-shell">
    <aside th:replace="~{fragments/navigation :: dashboardSidebar('admin', 'admin.title')}"></aside>

    <div class="dashboard-main-shell">
        <header class="dashboard-topbar">
            <button type="button" class="dashboard-menu-button" data-testid="dashboard-sidebar-toggle" th:attr="aria-label=#{common.toggleSidebar}" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
            </button>
            <strong th:text="#{admin.title}">Admin Dashboard</strong>
            <div th:replace="~{fragments/navigation :: topbarActions}"></div>
        </header>

        <main class="dashboard-page admin-page">
            <section class="admin-page-heading">
                <div>
                    <h1 data-testid="admin-dashboard-title" th:text="#{admin.pageTitle}">Admin Dashboard</h1>
                    <p th:text="#{admin.subtitle}">Overview of all tasks in the system.</p>
                </div>
                <div class="admin-page-actions">
                    <a th:href="@{/tasks}" class="tasks-action-primary" data-testid="back-to-task-list-link">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12"></path><path d="M8 12h12"></path><path d="M8 18h12"></path><path d="M4 6h.01"></path><path d="M4 12h.01"></path><path d="M4 18h.01"></path></svg>
                        <span th:text="#{admin.taskList}">Task list</span>
                    </a>
                    <a th:href="@{/admin/labels}" class="tasks-action-primary tasks-action-solid" data-testid="admin-labels-link">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.2 13.2 20.6a2 2 0 0 1-2.8 0L3 13.2V3h10.2l7.4 7.4a2 2 0 0 1 0 2.8Z"></path><path d="M7.5 7.5h.01"></path></svg>
                        <span th:text="#{admin.labels}">Labels</span>
                    </a>
                </div>
            </section>

            <section class="admin-table-card">
                <table class="admin-table" data-testid="admin-task-table">
                    <thead>
                    <tr>
                        <th th:text="#{common.id}">ID</th>
                        <th th:text="#{common.title}">Title</th>
                        <th th:text="#{common.status}">Status</th>
                        <th th:text="#{common.priority}">Priority</th>
                        <th th:text="#{common.dueDate}">Due date</th>
                        <th th:text="#{common.owner}">Owner</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="task : ${tasks}" th:attr="data-testid='admin-task-row-' + ${task.id()}">
                        <td th:text="${task.id()}"></td>
                        <td class="admin-task-title" th:text="${task.title()}"></td>
                        <td>
                            <span th:text="${#messages.msg('task.status.' + task.status())}"
                                  th:class="'status-badge status-' + ${task.status()}"></span>
                        </td>
                        <td>
                            <span th:class="'priority-dot priority-' + ${task.priority()}"></span>
                            <span th:text="${#messages.msg('task.priority.' + task.priority())}"></span>
                        </td>
                        <td th:text="${task.dueDate()}"></td>
                        <td th:text="${task.ownerEmail()}"></td>
                    </tr>
                    <tr class="empty-table-row" th:if="${#lists.isEmpty(tasks)}">
                        <td colspan="6" th:text="#{empty.tasks}">No tasks found.</td>
                    </tr>
                    </tbody>
                </table>
                <div class="tasks-table-footer">
                    <span th:text="#{pagination.tasks(${firstItem}, ${lastItem}, ${taskPage.totalElements()})}" data-testid="admin-pagination-summary"></span>
                    <div class="tasks-pagination" data-testid="admin-pagination">
                        <span th:if="${taskPage.first()}">&lsaquo;</span>
                        <a th:if="${!taskPage.first()}" th:href="@{/admin(page=${taskPage.page() - 1},size=${taskPage.size()})}" data-testid="admin-pagination-prev">&lsaquo;</a>
                        <a th:each="pageNumber : ${pageNumbers}"
                           th:href="@{/admin(page=${pageNumber},size=${taskPage.size()})}"
                           th:text="${pageNumber + 1}"
                           th:classappend="${pageNumber == taskPage.page()} ? ' is-active'"
                           th:attr="data-testid='admin-pagination-page-' + ${pageNumber + 1}"></a>
                        <span th:if="${taskPage.last()}">&rsaquo;</span>
                        <a th:if="${!taskPage.last()}" th:href="@{/admin(page=${taskPage.page() + 1},size=${taskPage.size()})}" data-testid="admin-pagination-next">&rsaquo;</a>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
